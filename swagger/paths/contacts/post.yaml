tags:
  - Contacts
summary: Create new contact
operationId: createContactController
description: Create new contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required: [name, phoneNumber]
        properties:
          name:
            description: "Contact's name."
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number."
            type: number
            example: +380989809898
          email:
            description: "Contact's email."
            type: string
            example: contact@email.com
          isFavourite:
            description: 'Describes whether contact has been added to favourites or not.'
            type: boolean
            default: false
          contactType:
            description: "Contact's type."
            type: string
            enum: ['personal', 'work', 'home']
            default: personal
          photo:
            description: "Link to Contact's photo."
            type: string
            format: binary
            example: <https://res.cloudinary.com/uqwgdu/image/upload/image.png>
responses:
  '201':
    description: Contact created with success
    content:
      application/json:
        schema:
          type: object
          required: ['status', 'message', 'data']
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '400':
    description: Bad request
    content:
      application/json:
        schema:
          type: object
          required: ['status', 'message', 'data']
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Bad request
            data:
              type: object
              properties:
                message:
                  type: string
                  example: Bad request
                errors:
                  type: array
                  items:
                    type: object
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    description: Server error
