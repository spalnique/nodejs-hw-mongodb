tags:
  - Contacts
summary: Patch contact by id
operationId: patchContactController
description: Patch contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name."
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number."
            type: number
            example: +380989809898
          email:
            description: "Contact's email."
            type: string
            example: contact@email.com
          isFavourite:
            description: 'Describes whether contact has been added to favourites or not.'
            type: boolean
            default: false
          contactType:
            description: "Contact's type."
            type: string
            enum: ['personal', 'work', 'home']
            default: personal
          photo:
            description: "Link to Contact's photo."
            type: string
            format: binary
responses:
  '200':
    description: Patch contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with provided id!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '500':
    description: Server error
